    #btn-turbo    { background: linear-gradient(180deg, #e0f2fe, #7dd3fc); color: #0c4a6e; }

  <div id="thumb-cluster">
    <button id="btn-turbo" type="button" title="Turbo Power Boost — Pro Feature (T)" class="slab-btn t-btn">⚡</button>

  </div>

  <script src="./three.min.js"></script>
  <script>
  (() => {
    'use strict';

    // =========================================================================
    // 1. RENDERER, SCENE, REALISTIC SKY & PMREM ENVIRONMENT REFLECTIONS
    // =========================================================================
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x9cb4c4, 0.0015);

    const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.5, 1800);

    const skyUniforms = {
      uTopColor: { value: new THREE.Color(0x1b4b7a) },
      uMidColor: { value: new THREE.Color(0x6d9dc2) },
      uHorizonColor: { value: new THREE.Color(0xcbdbe4) },
      uSunDir: { value: new THREE.Vector3(0.55, 0.52, -0.45).normalize() },
      uRainMix: { value: 0.0 }
    };
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: skyUniforms,
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform vec3 uTopColor;
        uniform vec3 uMidColor;
        uniform vec3 uHorizonColor;
        uniform vec3 uSunDir;
        uniform float uRainMix;
        varying vec3 vWorldPos;
        void main() {
          vec3 dir = normalize(vWorldPos);
          float h = clamp(dir.y, 0.0, 1.0);
          vec3 col = mix(uHorizonColor, uMidColor, smoothstep(0.0, 0.24, h));
          col = mix(col, uTopColor, smoothstep(0.24, 0.82, h));
          float sunDot = max(dot(dir, normalize(uSunDir)), 0.0);
          col += vec3(1.0, 0.94, 0.78) * pow(sunDot, 120.0) * 1.4 * (1.0 - uRainMix * 0.92);
          col += vec3(0.96, 0.90, 0.76) * pow(sunDot, 8.0) * 0.22 * (1.0 - uRainMix * 0.85);
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(1250, 36, 24), skyMat));

    const pmrem = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 24, 16), skyMat));
    scene.environment = pmrem.fromScene(envScene, 0.04).texture;

    const hemiLight = new THREE.HemisphereLight(0xd2e7f7, 0x1e2e1d, 0.88);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff3d6, 2.25);
    sunLight.position.set(160, 220, -140);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 15;
    sunLight.shadow.camera.far = 700;
    const dCam = 180;
    sunLight.shadow.camera.left = -dCam;
    sunLight.shadow.camera.right = dCam;
    sunLight.shadow.camera.top = dCam;
    sunLight.shadow.camera.bottom = -dCam;
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);
    scene.add(sunLight.target);

    // =========================================================================
    // 2. NOISE & ABURI MOUNTAIN SPLINE
    // =========================================================================
    function hash2(x, y) {
      const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return s - Math.floor(s);
    }
    function valueNoise(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      const a = hash2(ix, iy), b = hash2(ix + 1, iy);
      const c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }
    function fbm(x, y, oct = 4) {
      let v = 0, amp = 0.5, freq = 1;
      for (let i = 0; i < oct; i++) {
        v += amp * valueNoise(x * freq, y * freq);
        freq *= 2.03; amp *= 0.5;
      }
      return v;
    }
    function smoothstep(e0, e1, x) {
      const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
      return t * t * (3 - 2 * t);
    }

    const routeControlPoints = [
      new THREE.Vector3(-230,   8,  210),
      new THREE.Vector3(-135,  16,  235),
      new THREE.Vector3( -30,  30,  200),
      new THREE.Vector3(  60,  44,  245),
      new THREE.Vector3( 160,  60,  205),
      new THREE.Vector3( 218,  76,  108),
      new THREE.Vector3( 132,  90,   42),
      new THREE.Vector3( 198, 104,  -55),
      new THREE.Vector3( 155, 114, -165),
      new THREE.Vector3(  55, 116, -225),
      new THREE.Vector3( -65, 110, -210),
      new THREE.Vector3(-165,  92, -165),
      new THREE.Vector3(-235,  70,  -95),
      new THREE.Vector3(-175,  50,  -15),
      new THREE.Vector3(-265,  32,   55),
      new THREE.Vector3(-295,  16,  145)
    ];

    const roadCurve = new THREE.CatmullRomCurve3(routeControlPoints, true, 'catmullrom', 0.48);
    const ROAD_HALF = 6.4;
    const SAMPLES = 960;
    const roadSamples = [];
    const totalLen = roadCurve.getLength();
    for (let i = 0; i < SAMPLES; i++) {
      const t = i / SAMPLES;
      const pos = roadCurve.getPointAt(t);
      const tan = roadCurve.getTangentAt(t).normalize();
      const right = new THREE.Vector3().crossVectors(tan, new THREE.Vector3(0, 1, 0)).normalize();
      const up = new THREE.Vector3().crossVectors(right, tan).normalize();
      roadSamples.push({ t, pos, tan, right, up });
    }

    function getNearestRoadSample(x, z) {
      let bestIdx = 0, bestD2 = Infinity;
      const step = 6;
      for (let i = 0; i < SAMPLES; i += step) {
        const p = roadSamples[i].pos;
        const dx = x - p.x, dz = z - p.z;
        const d2 = dx * dx + dz * dz;
        if (d2 < bestD2) { bestD2 = d2; bestIdx = i; }
      }
      let best = roadSamples[bestIdx];
      for (let k = -step; k <= step; k++) {
        const idx = (bestIdx + k + SAMPLES) % SAMPLES;
        const p = roadSamples[idx].pos;
        const dx = x - p.x, dz = z - p.z;
        const d2 = dx * dx + dz * dz;
        if (d2 < bestD2) { bestD2 = d2; best = roadSamples[idx]; }
      }
      return { sample: best, dist: Math.sqrt(bestD2) };
    }

    function getRoadFrameAtT(t) {
      const tt = ((t % 1) + 1) % 1;
      const pos = roadCurve.getPointAt(tt);
      const tan = roadCurve.getTangentAt(tt).normalize();
      const right = new THREE.Vector3().crossVectors(tan, new THREE.Vector3(0, 1, 0)).normalize();
      const up = new THREE.Vector3().crossVectors(right, tan).normalize();
      return { t: tt, pos, tan, right, up };
    }

    // =========================================================================
    // 3. DETAILED 3D MOUNTAIN TERRAIN, LAYERED RIDGES & VALLEY TOWN
    // =========================================================================
    function createTerrainDetailTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#8b9980';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 18000; i++) {
        const x = Math.random() * 512, y = Math.random() * 512;
        const r = 1 + Math.random() * 3.5;
        const v = 88 + Math.floor(Math.random() * 98);
        ctx.fillStyle = `rgba(${v},${v + 9},${v - 7},0.3)`;
        ctx.fillRect(x, y, r, r);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(46, 46);
      return tex;
    }

    const TERRAIN_SIZE = 1600;
    const TERRAIN_SEGS = 240;
    const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGS, TERRAIN_SEGS);
    terrainGeo.rotateX(-Math.PI / 2);

    const tPos = terrainGeo.attributes.position;
    const tColors = new Float32Array(tPos.count * 3);

    function baseMountainHeight(x, z) {
      const ridge = smoothstep(-280, 240, x * 0.55 - z * 0.65) * 98;
      const valleyBowl = -smoothstep(190, 35, Math.hypot(x + 90, z - 25)) * 32;
      const n1 = (fbm((x + 500) * 0.0045, (z + 500) * 0.0045, 4) - 0.45) * 62;
      const n2 = (fbm((x + 120) * 0.018, (z + 120) * 0.018, 3) - 0.5) * 16;
      const crags = (fbm(x * 0.045, z * 0.045, 2) - 0.5) * 5.5;
      return Math.max(-22, ridge + valleyBowl + n1 + n2 + crags);
    }

    function getTerrainHeight(x, z) {
      const natH = baseMountainHeight(x, z);
      const { sample, dist } = getNearestRoadSample(x, z);
      const roadH = sample.pos.y - 0.55;
      const blend = 1.0 - smoothstep(ROAD_HALF + 3.0, ROAD_HALF + 26.0, dist);
      let h = natH * (1 - blend) + roadH * blend;
      if (dist > ROAD_HALF + 4.0 && dist < ROAD_HALF + 20.0 && natH > roadH + 2.0) {
        h += (fbm(x * 0.08, z * 0.08, 3) - 0.25) * 4.5;
      }
      return h;
    }

    for (let i = 0; i < tPos.count; i++) {
      const x = tPos.getX(i), z = tPos.getZ(i);
      const natH = baseMountainHeight(x, z);
      const { sample, dist } = getNearestRoadSample(x, z);
      const roadH = sample.pos.y - 0.55;
      const h = getTerrainHeight(x, z);
      tPos.setY(i, h);

      const nA = fbm(x * 0.03, z * 0.03, 3);
      const nB = fbm(x * 0.11, z * 0.11, 2);
      let r = 0.12, g = 0.28, b = 0.11;
      if (dist < ROAD_HALF + 13 && natH > roadH + 3.2) {
        const rockMix = smoothstep(0.35, 0.7, nB);
        r = 0.34 * (1 - rockMix) + 0.44 * rockMix;
        g = 0.30 * (1 - rockMix) + 0.27 * rockMix;
        b = 0.26 * (1 - rockMix) + 0.18 * rockMix;
      } else if (h < 10) {
        r = 0.08 + nA * 0.06; g = 0.23 + nA * 0.10; b = 0.09 + nA * 0.04;
      } else {
        r = 0.11 + nA * 0.09; g = 0.29 + nA * 0.14 + nB * 0.05; b = 0.10 + nA * 0.05;
      }
      tColors[i * 3] = r; tColors[i * 3 + 1] = g; tColors[i * 3 + 2] = b;
    }
    terrainGeo.setAttribute('color', new THREE.BufferAttribute(tColors, 3));
    terrainGeo.computeVertexNormals();

    const terrainMesh = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({
      map: createTerrainDetailTexture(),
      vertexColors: true,
      roughness: 0.94,
      metalness: 0.02
    }));
    terrainMesh.receiveShadow = true;
    scene.add(terrainMesh);

    const baseFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(2600, 2600),
      new THREE.MeshStandardMaterial({ color: 0x152b18, roughness: 0.98 })
    );
    baseFloor.rotation.x = -Math.PI / 2;
    baseFloor.position.y = -26;
    scene.add(baseFloor);

    // Layered 3D Distant Mountain Ridges
    [
      { radius: 560, height: 155, color: 0x29483a, yBase: -18 },
      { radius: 780, height: 225, color: 0x3b5d62, yBase: -22 },
      { radius: 1020, height: 285, color: 0x5c7b8f, yBase: -26 }
    ].forEach((rc, idx) => {
      const geo = new THREE.CylinderGeometry(rc.radius, rc.radius + 95, rc.height, 140, 8, true);
      const p = geo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
        if (vy > -rc.height * 0.35) {
          const ang = Math.atan2(vz, vx);
          const n = fbm(Math.cos(ang) * 2.4 + idx * 7, Math.sin(ang) * 2.4 + idx * 3, 4);
          const peak = (vy + rc.height * 0.5) / rc.height;
          p.setY(i, vy + (n - 0.35) * rc.height * 0.92 * peak);
        }
      }
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: rc.color, roughness: 0.96, side: THREE.DoubleSide }));
      m.position.y = rc.yBase + rc.height * 0.4;
      scene.add(m);
    });

    // Distant Valley Town Buildings
    const bldgMats = [
      new THREE.MeshStandardMaterial({ color: 0xd9cbb8, roughness: 0.85 }),
      new THREE.MeshStandardMaterial({ color: 0xc2b29b, roughness: 0.85 }),
      new THREE.MeshStandardMaterial({ color: 0xa86448, roughness: 0.85 })
    ];
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x7c2d12, roughness: 0.75 });
    for (let i = 0; i < 65; i++) {
      const angle = hash2(i, 11) * Math.PI * 2;
      const rad = 18 + hash2(i, 23) * 85;
      const bx = -95 + Math.cos(angle) * rad, bz = 25 + Math.sin(angle) * rad;
      const { dist } = getNearestRoadSample(bx, bz);
      if (dist < ROAD_HALF + 18) continue;
      const by = getTerrainHeight(bx, bz);
      const w = 4 + hash2(i, 31) * 5, h = 3.5 + hash2(i, 47) * 7, d = 4 + hash2(i, 59) * 5;
      const bMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bldgMats[i % bldgMats.length]);
      bMesh.position.set(bx, by + h * 0.5 - 0.6, bz);
      bMesh.rotation.y = hash2(i, 71) * Math.PI;
      bMesh.castShadow = true;
      scene.add(bMesh);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.72, 1.8, 4), roofMat);
      roof.position.set(bx, by + h + 0.3, bz);
      roof.rotation.y = bMesh.rotation.y + Math.PI / 4;
      scene.add(roof);
    }

    // =========================================================================
    // 4. REALISTIC TAR ROAD (BUMP + WET CLEARCOAT), BARRIERS & ROADSIDE PROPS
    // =========================================================================
    function createTarRoadTextures() {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');
      // Rich dark tar-asphalt base
      ctx.fillStyle = '#181b20';
      ctx.fillRect(0, 0, 1024, 1024);

      // Fine mineral aggregate speckle
      for (let i = 0; i < 36000; i++) {
        const x = Math.random() * 1024, y = Math.random() * 1024;
        const v = 16 + Math.floor(Math.random() * 34);
        ctx.fillStyle = `rgb(${v},${v + 1},${v + 3})`;
        ctx.fillRect(x, y, 2, 2);
      }

      // Subtle tar-sealant cracks for realism
      ctx.strokeStyle = 'rgba(7, 8, 10, 0.55)';
      ctx.lineWidth = 2;
      for (let k = 0; k < 14; k++) {
        ctx.beginPath();
        let cx = 120 + Math.random() * 780, cy = Math.random() * 1024;
        ctx.moveTo(cx, cy);
        for (let s = 0; s < 6; s++) {
          cx += (Math.random() - 0.5) * 45;
          cy += 25 + Math.random() * 30;
          ctx.lineTo(cx, cy);
        }
        ctx.stroke();
      }

      // Glossy wheel-wear tracks in both lanes
      ctx.fillStyle = 'rgba(6, 8, 11, 0.38)';
      ctx.fillRect(210, 0, 185, 1024);
      ctx.fillRect(625, 0, 185, 1024);

      // Gravel/tar shoulders
      ctx.fillStyle = '#2d2a26';
      ctx.fillRect(0, 0, 52, 1024);
      ctx.fillRect(972, 0, 52, 1024);

      // Crisp white edge lines
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(60, 0, 16, 1024);
      ctx.fillRect(948, 0, 16, 1024);

      // Crisp white dashed center divider
      for (let y = 0; y < 1024; y += 128) ctx.fillRect(500, y + 16, 24, 68);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 8;

      // Roughness puddle map
      const rc = document.createElement('canvas');
      rc.width = 256; rc.height = 256;
      const rctx = rc.getContext('2d');
      rctx.fillStyle = '#666';
      rctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 120; i++) {
        const px = Math.random() * 256, py = Math.random() * 256;
        const rad = 10 + Math.random() * 34;
        const g = rctx.createRadialGradient(px, py, 2, px, py, rad);
        g.addColorStop(0, 'rgba(10,10,10,0.92)');
        g.addColorStop(1, 'rgba(95,95,95,0)');
        rctx.fillStyle = g;
        rctx.beginPath(); rctx.arc(px, py, rad, 0, Math.PI * 2); rctx.fill();
      }
      const roughTex = new THREE.CanvasTexture(rc);
      roughTex.wrapS = THREE.RepeatWrapping;
      roughTex.wrapT = THREE.RepeatWrapping;

      return { tex, roughTex };
    }

    const { tex: roadTex, roughTex: roadRoughTex } = createTarRoadTextures();
    const roadMat = new THREE.MeshPhysicalMaterial({
      map: roadTex,
      bumpMap: roadTex,
      bumpScale: 0.035,
      roughnessMap: roadRoughTex,
      roughness: 0.52,
      metalness: 0.12,
      clearcoat: 0.25,
      clearcoatRoughness: 0.35,
      envMapIntensity: 1.4

    const roadPositions = [], roadUVs = [], roadIndices = [];
    const skirtPos = [], skirtIdx = [];
    let accumLen = 0;
    for (let i = 0; i <= SAMPLES; i++) {
      const s = roadSamples[i % SAMPLES];
      const prev = roadSamples[(i - 1 + SAMPLES) % SAMPLES];
      if (i > 0) accumLen += s.pos.distanceTo(prev.pos);
      const lPt = s.pos.clone().addScaledVector(s.right, -ROAD_HALF);
      const rPt = s.pos.clone().addScaledVector(s.right, ROAD_HALF);
      roadPositions.push(lPt.x, lPt.y + 0.08, lPt.z, rPt.x, rPt.y + 0.08, rPt.z);
      roadUVs.push(0, accumLen / 16, 1, accumLen / 16);
      skirtPos.push(
        lPt.x, lPt.y + 0.08, lPt.z, lPt.x, lPt.y - 2.6, lPt.z,
        rPt.x, rPt.y + 0.08, rPt.z, rPt.x, rPt.y - 2.6, rPt.z
      );
      if (i < SAMPLES) {
        const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
        roadIndices.push(a, b, c, b, d, c);
        const sa = i * 4, sb = sa + 4;
        skirtIdx.push(sa, sa + 1, sb, sa + 1, sb + 1, sb);
        skirtIdx.push(sa + 2, sb + 2, sa + 3, sa + 3, sb + 2, sb + 3);
      }
    }
    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadPositions, 3));
    roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(roadUVs, 2));
    roadGeo.setIndex(roadIndices);
    roadGeo.computeVertexNormals();
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    roadMesh.receiveShadow = true;
    scene.add(roadMesh);

    const skirtGeo = new THREE.BufferGeometry();
    skirtGeo.setAttribute('position', new THREE.Float32BufferAttribute(skirtPos, 3));
    skirtGeo.setIndex(skirtIdx);
    skirtGeo.computeVertexNormals();
    scene.add(new THREE.Mesh(skirtGeo, new THREE.MeshStandardMaterial({ color: 0x333942, roughness: 0.92, side: THREE.DoubleSide })));

    // Red-and-White Concrete Jersey Barriers, Curve Chevrons & Utility Poles

    const woodPoleMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });

    for (let i = 0; i < SAMPLES; i += 2) {
      const s = roadSamples[i], next = roadSamples[(i + 2) % SAMPLES];
      for (const side of [-1, 1]) {
        const edge = s.pos.clone().addScaledVector(s.right, side * (ROAD_HALF + 0.48));
        const edgeNext = next.pos.clone().addScaledVector(next.right, side * (ROAD_HALF + 0.48));
        const natH = baseMountainHeight(edge.x, edge.z);
        if (edge.y - natH > 1.2 || (side === 1 && i % 4 === 0)) {
          const span = edge.distanceTo(edgeNext);
          const mid = edge.clone().add(edgeNext).multiplyScalar(0.5);
          const barrier = new THREE.Mesh(
            new THREE.BoxGeometry(0.46, 0.88, span + 0.08),
            (((i >> 1) % 2) === 0) ? barrierRedMat : barrierWhiteMat
          );
          barrier.position.set(mid.x, mid.y + 0.44, mid.z);
          barrier.lookAt(edgeNext.x, edgeNext.y + 0.44, edgeNext.z);
          barrier.castShadow = true;
          barrier.receiveShadow = true;
          scene.add(barrier);
        }
      }
      // Roadside utility poles every ~28 samples
      if (i % 28 === 0) {
        const pPos = s.pos.clone().addScaledVector(s.right, -(ROAD_HALF + 2.1));
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.14, 7.2, 7), woodPoleMat);
        pole.position.set(pPos.x, pPos.y + 3.5, pPos.z);
        pole.castShadow = true;
        scene.add(pole);
        const crossArm = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.1, 0.1), woodPoleMat);
        crossArm.position.set(pPos.x, pPos.y + 6.7, pPos.z);
        scene.add(crossArm);
      }
      const prev = roadSamples[(i - 4 + SAMPLES) % SAMPLES];
      if (s.tan.dot(prev.tan) < 0.992 && i % 10 === 0) {
        const cross = new THREE.Vector3().crossVectors(prev.tan, s.tan);
        const outerSide = cross.y > 0 ? 1 : -1;
        const p = s.pos.clone().addScaledVector(s.right, outerSide * (ROAD_HALF + 1.35));
        const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.2, 6), postMat);
        sp.position.set(p.x, p.y + 1.1, p.z);
        scene.add(sp);
        const board = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.65, 0.08), chevronMat);
        board.position.set(p.x, p.y + 1.9, p.z);
        board.lookAt(s.pos.x, p.y + 1.9, s.pos.z);
        scene.add(board);
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.42, 0.1), chevronStripeMat);
        stripe.position.copy(board.position);
        stripe.quaternion.copy(board.quaternion);
        scene.add(stripe);
      }
    }

    // Ghana Roadside Fruit Stall & Aburi Ridge Signpost near Summit Overlook (t = 0.45)

    // =========================================================================
    // 5. DENSE TROPICAL FOLIAGE, OIL PALMS, FERN SHRUBS & ROCK CLIFFS
    // =========================================================================
    function createFoliageTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 256, 256);
      const greens = ['#143d18', '#1f5422', '#2b6b29', '#387d2e', '#17471e'];
      for (let i = 0; i < 160; i++) {
        const ang = Math.random() * Math.PI * 2;
        const rad = Math.random() * 92;
        const x = 128 + Math.cos(ang) * rad, y = 128 + Math.sin(ang) * rad;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang + Math.random());
        ctx.fillStyle = greens[i % greens.length];
        ctx.beginPath();
        ctx.ellipse(0, 0, 18 + Math.random() * 14, 7 + Math.random() * 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      return new THREE.CanvasTexture(c);
    }
    const foliageTex = createFoliageTexture();
    const foliageMat = new THREE.MeshStandardMaterial({
      map: foliageTex,
      alphaTest: 0.30,
      side: THREE.DoubleSide,
      roughness: 0.82
    });
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4d382a, roughness: 0.94 });
    const rockMats = [
      new THREE.MeshStandardMaterial({ color: 0x57534e, roughness: 0.94, flatShading: true }),
      new THREE.MeshStandardMaterial({ color: 0x6e4733, roughness: 0.92, flatShading: true })
    ];

    function addRealisticTree(x, y, z, scale, seed) {
      const g = new THREE.Group();
      const h = (5.4 + hash2(seed, 5) * 4.0) * scale;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * scale, 0.38 * scale, h, 8), trunkMat);
      trunk.position.y = h * 0.5;
      trunk.castShadow = true;
      g.add(trunk);
      for (let c = 0; c < 5; c++) {
        const ang = (c / 5) * Math.PI * 2 + hash2(seed, c);
        const cx = Math.cos(ang) * 1.45 * scale, cy = h * (0.78 + (c % 2) * 0.16), cz = Math.sin(ang) * 1.45 * scale;
        const sz = (3.6 + hash2(seed, c + 10) * 1.6) * scale;
        for (let rot = 0; rot < 2; rot++) {
          const card = new THREE.Mesh(new THREE.PlaneGeometry(sz, sz * 0.82), foliageMat);
          card.position.set(cx, cy, cz);
          card.rotation.y = ang + rot * (Math.PI / 2);
          card.rotation.x = (hash2(seed + c, rot) - 0.5) * 0.45;
          card.castShadow = true;
          g.add(card);
        }
      }
      g.position.set(x, y - 0.25, z);
      scene.add(g);
    }

    function addRealisticPalm(x, y, z, scale, seed) {
      const g = new THREE.Group();
      const h = 8.4 * scale;
      const lean = (hash2(seed, 3) - 0.5) * 0.24;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14 * scale, 0.26 * scale, h, 8), trunkMat);
      trunk.position.y = h * 0.5;
      trunk.rotation.z = lean;
      trunk.castShadow = true;
      g.add(trunk);
      const topX = -Math.sin(lean) * h * 0.5, topY = h * 0.96;
      for (let f = 0; f < 9; f++) {
        const ang = (f / 9) * Math.PI * 2 + hash2(seed, f) * 0.35;
        const frond = new THREE.Mesh(new THREE.PlaneGeometry(1.45 * scale, 4.3 * scale), foliageMat);
        frond.position.set(topX + Math.cos(ang) * 1.8 * scale, topY - 0.3 * scale, Math.sin(ang) * 1.8 * scale);
        frond.rotation.order = 'YXZ';
        frond.rotation.y = ang + Math.PI / 2;
        frond.rotation.x = Math.PI * 0.34;
        frond.castShadow = true;
        g.add(frond);
      }
      g.position.set(x, y - 0.25, z);
      scene.add(g);
    }

    function addFernShrub(x, y, z, scale, seed) {
      const g = new THREE.Group();
      const sz = 2.4 * scale;
      for (let rot = 0; rot < 3; rot++) {
        const card = new THREE.Mesh(new THREE.PlaneGeometry(sz, sz * 0.72), foliageMat);
        card.position.y = sz * 0.3;
        card.rotation.y = (rot / 3) * Math.PI + hash2(seed, rot);
        g.add(card);
      }
      g.position.set(x, y - 0.15, z);
      scene.add(g);
    }

    function addRockOutcrop(x, y, z, scale, seed) {
      const geo = new THREE.DodecahedronGeometry(1.9 * scale, 1);
      const p = geo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const n = 0.72 + hash2(i + seed, seed) * 0.55;
        p.setXYZ(i, p.getX(i) * n * 1.35, p.getY(i) * n * 0.8, p.getZ(i) * n * 1.2);
      }
      geo.computeVertexNormals();
      const rock = new THREE.Mesh(geo, rockMats[seed % rockMats.length]);
      rock.position.set(x, y + 0.35 * scale, z);
      rock.rotation.set(hash2(seed, 1), hash2(seed, 2) * Math.PI, hash2(seed, 3));
      rock.castShadow = true;
      rock.receiveShadow = true;
      scene.add(rock);
    }

    for (let i = 0; i < 480; i++) {
      const rx = (hash2(i, 101) - 0.5) * 780, rz = (hash2(i, 202) - 0.5) * 720;
      const { dist } = getNearestRoadSample(rx, rz);
      if (dist < ROAD_HALF + 7.2) continue;
      const ry = getTerrainHeight(rx, rz);
      const sc = 0.8 + hash2(i, 303) * 0.9;
      const k = i % 9;
      if (k === 0 || k === 1) addRealisticPalm(rx, ry, rz, sc, i);
      else if (k >= 2 && k <= 4) addRealisticTree(rx, ry, rz, sc, i);
      else if (k === 5 || k === 6) addFernShrub(rx, ry, rz, sc, i);
      else addRockOutcrop(rx, ry, rz, sc * 1.2, i);
    }

    const contactShadowTex = createShadowTexture();
    function makeContactShadow(w, l) {

        new THREE.MeshBasicMaterial({ map: contactShadowTex, transparent: true, depthWrite: false })
      );
      m.rotation.x = -Math.PI / 2;
      m.position.y = 0.03;
      return m;
    }

    function createRoundedBox(w, h, d, radius = 0.14, smoothness = 4) {
      const shape = new THREE.Shape();
      const eps = 0.00001;
      const r = Math.min(radius, w * 0.45, h * 0.45, d * 0.45) - eps;
      const hw = w * 0.5 - radius, hh = h * 0.5 - radius;
      shape.absarc(-hw, -hh, r, -Math.PI, -Math.PI * 0.5, true);
      shape.absarc( hw, -hh, r, -Math.PI * 0.5, 0, true);
      shape.absarc( hw,  hh, r, 0, Math.PI * 0.5, true);
      shape.absarc(-hw,  hh, r, Math.PI * 0.5, Math.PI, true);
      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: d - radius * 2,
        bevelEnabled: true,
        bevelSegments: smoothness,
        steps: 1,
        bevelSize: r,
        bevelThickness: radius,
        curveSegments: smoothness
      });
      geom.center();
      return geom;
    }

      railL.position.set(-0.78, 2.20, 0.1);

      railR.position.x = 0.78;
      rackGroup.add(railL, railR);
      for (let z = -1.3; z <= 1.5; z += 0.7) {

    // Realistic Traffic Vehicles (SUVs, Sedans, Pickups & Box Trucks — ALL with visible tires, rims & contact shadows!)
    function createRealisticTrafficVehicle(color, kind) {
      const g = new THREE.Group();
      const paintMat = new THREE.MeshPhysicalMaterial({ color, roughness: 0.28, metalness: 0.22, clearcoat: 0.65 });
      const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x0f172a, roughness: 0.12, metalness: 0.4, clearcoat: 0.8 });
      const trimMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x0f1216, roughness: 0.9 });
      const rimMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.85, roughness: 0.25 });

      const isTruck = kind === 'truck';
      const isSuv = kind === 'suv';
      const len = isTruck ? 5.6 : 4.35;
      const wid = isTruck ? 2.2 : 1.88;

      // Ground contact shadow (prevents any floating appearance!)
      g.add(makeContactShadow(wid + 0.7, len + 0.8));

      if (isTruck) {
        // Cab + cargo box
        const cab = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.65, 1.65), paintMat);
        cab.position.set(0, 1.22, -1.9);
        cab.castShadow = true;
        g.add(cab);
        const wShield = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.72, 0.08), glassMat);
        wShield.position.set(0, 1.48, -2.74);
        g.add(wShield);
        const cargo = new THREE.Mesh(new THREE.BoxGeometry(2.24, 2.05, 3.85), new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.6 }));
        cargo.position.set(0, 1.55, 0.95);
        cargo.castShadow = true;
        g.add(cargo);
      } else {
        // Realistic sedan / SUV lower chassis + tapered cabin + bumpers
        const lower = new THREE.Mesh(new THREE.BoxGeometry(wid, 0.68, len), paintMat);
        lower.position.y = 0.68;
        lower.castShadow = true;
        g.add(lower);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(wid * 0.86, isSuv ? 0.62 : 0.52, isSuv ? 2.65 : 2.15), glassMat);
        cabin.position.set(0, isSuv ? 1.32 : 1.26, 0.22);
        cabin.castShadow = true;
        g.add(cabin);

        const roof = new THREE.Mesh(new THREE.BoxGeometry(wid * 0.84, 0.08, isSuv ? 2.55 : 1.95), paintMat);
        roof.position.set(0, isSuv ? 1.65 : 1.54, 0.22);
        g.add(roof);

        const fBump = new THREE.Mesh(new THREE.BoxGeometry(wid + 0.04, 0.22, 0.16), trimMat);
        fBump.position.set(0, 0.42, -len * 0.5);
        g.add(fBump);
        const rBump = new THREE.Mesh(new THREE.BoxGeometry(wid + 0.04, 0.22, 0.16), trimMat);
        rBump.position.set(0, 0.42, len * 0.5);
        g.add(rBump);
      }

      // Prominent protruding 4 tires + silver alloy rims sitting flush at y=0!
      const wRad = isTruck ? 0.44 : 0.36;
      const wGeo = new THREE.CylinderGeometry(wRad, wRad, 0.28, 16);
      wGeo.rotateZ(Math.PI / 2);
      const rGeo = new THREE.CylinderGeometry(wRad * 0.56, wRad * 0.56, 0.30, 12);
      rGeo.rotateZ(Math.PI / 2);
      const wxOff = wid * 0.5 - 0.02;
      const wzF = isTruck ? -1.85 : -1.35;
      const wzR = isTruck ? 1.85 : 1.35;
      for (const [wx, wz] of [[-wxOff, wzF], [wxOff, wzF], [-wxOff, wzR], [wxOff, wzR]]) {
        const tire = new THREE.Mesh(wGeo, tireMat);
        tire.position.set(wx, wRad, wz);
        tire.castShadow = true;
        g.add(tire);
        const rim = new THREE.Mesh(rGeo, rimMat);
        rim.position.set(wx, wRad, wz);
        g.add(rim);
      }

      // Headlights & Taillights
      const hlMat = new THREE.MeshBasicMaterial({ color: 0xfff3b0 });
      const tlMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
      for (const sx of [-wid * 0.34, wid * 0.34]) {
        const hl = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.14, 0.08), hlMat);
        hl.position.set(sx, 0.68, -len * 0.5 - 0.02);
        g.add(hl);
        const tl = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.14, 0.08), tlMat);
        tl.position.set(sx, 0.72, len * 0.5 + 0.02);

    const trafficPalette = [0x1e40af, 0x991b1b, 0x475569, 0x0f766e, 0xd97706, 0xe2e8f0];

    for (let i = 0; i < 14; i++) {

    // =========================================================================
    // 8. WEB AUDIO HORN, CONTROLS (HORN, HOP, REV, U-TURN + DRAG STEER) & LOOP
    // =========================================================================
    let audioCtx = null;
    function playTroTroHorn() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t0 = audioCtx.currentTime;
        for (const freq of [340, 428]) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, t0);
          gain.gain.setValueAtTime(0.08, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.28);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t0);
          osc.stop(t0 + 0.3);
        }
      } catch {}
    }

    const legParam = new URLSearchParams(window.location.search).get('leg');
    const state = {

      laneOffset: 2.6,
      speed: 14,
      hopY: 0,
      hopVy: 0,

      rainMode: 'auto',
      rainStrength: 0,

    function triggerHop() {
      if (state.hopY <= 0.02) {

    const keys = { w: false, s: false, a: false, d: false };
    const LEASH_PX = 56;
    const stick = { down: false, ax: 0, ay: 0, x: 0, y: 0, id: null };
    let dragSteer = 0;
    let dragThrottle = 0;

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      stick.down = true;
      stick.id = e.pointerId;
      stick.ax = e.clientX;
      stick.ay = e.clientY;
      stick.x = e.clientX;
      stick.y = e.clientY;
      dragSteer = 0;
      dragThrottle = 0;
    });
    window.addEventListener('pointermove', e => {
      if (!stick.down || e.pointerId !== stick.id) return;
      const dx = e.clientX - stick.ax;
      const dy = e.clientY - stick.ay;
      const dist = Math.hypot(dx, dy);
      if (dist > LEASH_PX) {
        stick.x = stick.ax + (dx / dist) * LEASH_PX;
        stick.y = stick.ay + (dy / dist) * LEASH_PX;
      } else {
        stick.x = e.clientX;
        stick.y = e.clientY;
      }
      dragSteer = Math.max(-1, Math.min(1, (stick.x - stick.ax) / LEASH_PX));
      dragThrottle = Math.max(-1, Math.min(1, -(stick.y - stick.ay) / LEASH_PX));
      if (dist > 8 && state.autoCruise) {
        state.autoCruise = false;
        syncButtons();
      }
    });
    const endStick = e => {
      if (!stick.down || (e.pointerId != null && e.pointerId !== stick.id)) return;
      stick.down = false;
      stick.id = null;
      dragSteer = 0;
      dragThrottle = 0;
    };
    window.addEventListener('pointerup', endStick);
    window.addEventListener('pointercancel', endStick);
    const resetAburiInputs = () => {
      keys.w = keys.a = keys.s = keys.d = false;
      stick.down = false;
      stick.id = null;
      dragSteer = 0;
      dragThrottle = 0;
      btnRev.classList.remove('pressed');
    };
    window.addEventListener('blur', resetAburiInputs);
    document.addEventListener('visibilitychange', () => { if (document.hidden) resetAburiInputs(); });

    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') { keys.w = true; state.autoCruise = false; syncButtons(); }
      if (k === 's' || e.key === 'ArrowDown') { keys.s = true; state.autoCruise = false; syncButtons(); }
      if (k === 'a' || e.key === 'ArrowLeft') { keys.a = true; state.autoCruise = false; syncButtons(); }
      if (k === 'd' || e.key === 'ArrowRight') { keys.d = true; state.autoCruise = false; syncButtons(); }
      if (k === 'u') flipDirection();
      if (k === 'r') cycleRainMode();

      if (e.code === 'Space') { e.preventDefault(); playTroTroHorn(); }
    });
    window.addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (k === 's' || e.key === 'ArrowDown') keys.s = false;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;

    // Ghana Regional Music Player (matching Ride Danfo Ghana pool)
    const MusicPlayer = (() => {
      let enabled = true;
      let idx = 0;
      let audio = null;
      const tracks = [
        { file: 'ghana_hot_amapiano.ogg', title: 'Hot Amapiano Beats — Alex Morgan (CC BY)' },
        { file: 'ghana_afrobeat.ogg',     title: 'Afrobeat — Alex Morgan (CC BY)' }

      function playTrack() {

        const nowEl = document.getElementById('music-now');
        if (nowEl) nowEl.textContent = `♪ ${tr.title}`;
        audio.play().catch(() => {
          const unlock = () => { if (enabled && audio && audio.paused) audio.play().catch(() => {}); };
          window.addEventListener('pointerdown', unlock, { once: true });
          window.addEventListener('keydown', unlock, { once: true });
        });

      function toggle() {
        enabled = !enabled;

    // Thumb cluster bindings: Turbo (Pro), Horn, Hop, Reverse, U-Turn (matching Ride Danfo)
    const btnTurbo = document.getElementById('btn-turbo');
    let turboOn = false;
    function isTurboUnlocked() {
      try {

      } catch { return false; }

    function toggleTurbo() {

        turboOn = false;
        btnTurbo?.classList.remove('turbo-on');
        triggerNarration('🔒 Pro Feature — Turbo Boost', 'Turbo Power Boost is a Pro feature! Tap Routes to unlock Pro in Motor Park or turn on Test Mode.', null);

    const btnHorn = document.getElementById('btn-horn-pad');

    });
    window.addEventListener('pointerup', () => { keys.s = false; btnRev.classList.remove('pressed'); });
    window.addEventListener('pointercancel', () => { keys.s = false; btnRev.classList.remove('pressed'); });
    btnUturn.addEventListener('pointerdown', e => { e.preventDefault(); flipDirection(); });
    btnUturn.addEventListener('click', flipDirection);
    document.getElementById('btn-music').addEventListener('click', () => MusicPlayer.toggle());

    const btnUphill = document.getElementById('btn-uphill');
    const btnDownhill = document.getElementById('btn-downhill');
    const btnKtown = document.getElementById('btn-ktown');
    const btnReturn = document.getElementById('btn-return');
    const btnRain = document.getElementById('btn-rain');
    const btnAuto = document.getElementById('btn-auto');
    const btnCam = document.getElementById('btn-cam');
    const zonePill = document.getElementById('zone-pill');
    const narrBox = document.getElementById('narration-box');
    const narrSpeaker = document.getElementById('narr-speaker');
    const narrText = document.getElementById('narr-text');

    function drawMatePortrait(isFemale) {
      const c = document.getElementById('mate-portrait');
      if (!c) return;
      const ctx = c.getContext('2d');
      ctx.fillStyle = isFemale ? '#fbcfe8' : '#fde68a';
      ctx.fillRect(0, 0, 44, 44);
      // Shirt
      ctx.fillStyle = isFemale ? '#9333ea' : '#1a8040';
      ctx.fillRect(8, 30, 28, 14);
      // Head
      ctx.fillStyle = '#5c3317';
      ctx.beginPath(); ctx.arc(22, 22, 10, 0, Math.PI * 2); ctx.fill();
      // Cap (Koffi red cap) or Headwrap (Auntie Akosua)
      ctx.fillStyle = isFemale ? '#dc2626' : '#cc1f1f';
      ctx.fillRect(11, 8, 22, 9);
      if (!isFemale) ctx.fillRect(11, 14, 26, 3); // Cap visor
      // Eyes & smile
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(17, 20, 3, 2); ctx.fillRect(24, 20, 3, 2);
      ctx.fillStyle = '#fde047';
      ctx.fillRect(18, 26, 8, 2);
    }

    let currentNarrAudio = null;
    function triggerNarration(speaker, line, voiceFile) {
      const sLow = (speaker + ' ' + line).toLowerCase();
      const isFemale = sLow.includes('akosua') || sLow.includes('ama') || sLow.includes('ronke') || sLow.includes('flowers') || sLow.includes('female');

    }

    function flipDirection() {

    document.getElementById('btn-back-routes').addEventListener('click', () => {

    btnUphill.addEventListener('click', () => {

    });
    btnDownhill.addEventListener('click', () => {

    });
    btnKtown.addEventListener('click', () => {

    function syncButtons() {
      const inKtown = state.t >= 0.40 && state.t <= 0.53;
      const inDownhill = state.t > 0.53 && state.t <= 0.96;
      btnUphill.classList.toggle('active', !inDownhill && !inKtown);
      btnDownhill.classList.toggle('active', inDownhill);
      btnKtown.classList.toggle('active', inKtown);
      btnReturn.classList.toggle('active', state.dir === -1);
      btnAuto.classList.toggle('active', state.autoCruise);
      btnAuto.textContent = `🚐 Auto-Cruise: ${state.autoCruise ? 'ON' : 'OFF'}`;
      btnRain.classList.toggle('active', state.rainMode === 'on');
      btnRain.textContent = `☔ Rain & Wet Road: ${state.rainMode.toUpperCase()}`;
      btnCam.textContent = `🎥 Cam: ${state.camMode === 'chase' ? 'Chase' : state.camMode === 'hood' ? 'Hood' : 'Ridge View'}`;
    }
    syncButtons();

    const spdEl = document.getElementById('spd-val');
    const altEl = document.getElementById('alt-val');
    const gradeEl = document.getElementById('grade-val');
    const dirEl = document.getElementById('dir-val');
    const progEl = document.getElementById('prog-val');

    const camTargetPos = new THREE.Vector3();
    const camLookTarget = new THREE.Vector3();
    let prevTime = performance.now();
    let overtakeUntil = 0;

    function animate(now) {
      requestAnimationFrame(animate);
      if (document.hidden || (typeof document.hasFocus === 'function' && !document.hasFocus())) {
        resetAburiInputs();
      }
      const dt = Math.min(0.05, (now - prevTime) / 1000);
      prevTime = now;

      const turboActive = turboOn && isTurboUnlocked();
      const spdMult = turboActive ? 1.75 : 1;
      const accMult = turboActive ? 2.0 : 1;

      if (state.autoCruise) {
        state.speed += (15.5 * spdMult - state.speed) * Math.min(1, 2.5 * dt);
        if (now > overtakeUntil) {
          state.laneOffset += (state.dir * 2.6 - state.laneOffset) * Math.min(1, 3 * dt);
        }
      } else {
        if (keys.s) state.speed -= 24 * dt;
        else if (keys.w) state.speed += 16 * accMult * dt;
        else if (stick.down) state.speed += dragThrottle * 20 * accMult * dt;
        else state.speed *= Math.pow(0.28, dt); // Coast smoothly to 0 when stopped/released
        if (Math.abs(state.speed) < 0.08 && !keys.w && !keys.s && !stick.down) state.speed = 0;
        state.speed = Math.max(-12, Math.min(26 * spdMult, state.speed));
        const steerDir = (keys.a ? -1 : 0) + (keys.d ? 1 : 0) + dragSteer;
        if (Math.abs(steerDir) > 0.05) state.laneOffset += steerDir * state.dir * 7.2 * dt;
        state.laneOffset = Math.max(-(ROAD_HALF - 1.4), Math.min(ROAD_HALF - 1.4, state.laneOffset));
      }

      // Hop physics
      if (state.hopY > 0 || state.hopVy !== 0) {
        state.hopY += state.hopVy * dt;
        state.hopVy -= 22.0 * dt;
        if (state.hopY <= 0) { state.hopY = 0; state.hopVy = 0; }
      }

      state.t = ((state.t + (state.dir * state.speed * dt) / totalLen) % 1 + 1) % 1;
      const frame = getRoadFrameAtT(state.t);
      const aheadFrame = getRoadFrameAtT(state.t + state.dir * 0.005);

      const busPos = frame.pos.clone().addScaledVector(frame.right, state.laneOffset);
      busPos.y += 0.08 + state.hopY;
      troTroMesh.position.copy(busPos);
      const fwd = frame.tan.clone().multiplyScalar(state.dir);
      const lookMat = new THREE.Matrix4().lookAt(busPos, busPos.clone().add(fwd), frame.up);
      troTroMesh.quaternion.setFromRotationMatrix(lookMat);

      const inKtown = state.t >= 0.40 && state.t <= 0.53;
      const inDownhill = state.t > 0.53 && state.t <= 0.96;
      const inSummit = false;
      const targetRain = state.rainMode === 'on' ? 1.0 : state.rainMode === 'off' ? 0.0 : (inDownhill ? 1.0 : 0.08);
      state.rainStrength += (targetRain - state.rainStrength) * Math.min(1, 1.8 * dt);

      // Animate Koforidua Flowers promenade walkers & check landmark voice narration
      for (const kw of koforiduaWalkers) {
        const stride = Math.sin(now * 0.0022 + kw.phase) * 2.2;
        kw.mesh.position.copy(kw.basePos).addScaledVector(kw.tan, stride);
      }
      for (const ev of koforiduaEvents) {
        if (!ev.spoken && Math.abs(state.t - ev.t) < 0.008) {
          ev.spoken = true;
          triggerNarration(ev.speaker, ev.line, ev.voice);
        }
      }
      if (narrBox.style.display === 'block' && now > narrHideAt) {
        narrBox.style.display = 'none';
      }

      skyUniforms.uRainMix.value = state.rainStrength;
      skyUniforms.uTopColor.value.setRGB(0.11 - 0.03 * state.rainStrength, 0.29 - 0.09 * state.rainStrength, 0.48 - 0.16 * state.rainStrength);
      skyUniforms.uHorizonColor.value.setRGB(0.80 - 0.24 * state.rainStrength, 0.86 - 0.22 * state.rainStrength, 0.90 - 0.18 * state.rainStrength);
      scene.fog.color.setRGB(0.61 - 0.18 * state.rainStrength, 0.71 - 0.18 * state.rainStrength, 0.77 - 0.14 * state.rainStrength);
      scene.fog.density = 0.0014 + state.rainStrength * 0.0020;
      sunLight.intensity = 2.25 - state.rainStrength * 1.25;
      hemiLight.intensity = 0.88 - state.rainStrength * 0.24;

      roadMat.roughness = 0.52 - state.rainStrength * 0.40;
      roadMat.clearcoat = 0.25 + state.rainStrength * 0.75;
      roadMat.clearcoatRoughness = 0.34 - state.rainStrength * 0.27;
      roadMat.metalness = 0.12 + state.rainStrength * 0.20;

      mistMat.opacity = 0.22 + state.rainStrength * 0.34;
      rainMat.opacity = state.rainStrength * 0.58;
      if (state.rainStrength > 0.05) {
        rainLines.position.set(camera.position.x, camera.position.y - 16, camera.position.z);
        const rp = rainGeo.attributes.position.array;
        for (let i = 0; i < RAIN_COUNT; i++) {
          let ry = rp[i * 6 + 1] - 36 * dt;
          if (ry < -5) ry += 44;
          rp[i * 6 + 1] = ry; rp[i * 6 + 4] = ry - 1.6;
        }
        rainGeo.attributes.position.needsUpdate = true;
      }

      for (const c of clouds) {
        c.position.x += c.userData.speed * dt;
        if (c.position.x > 500) c.position.x = -500;
      }
      for (const m of mistLayers) {
        m.position.x += m.userData.drift * dt;
        if (m.position.x > 160) m.position.x = -360;
        if (m.position.x < -360) m.position.x = 160;
      }

      for (const tc of trafficCars) {
        if (tc.curSpeed == null) tc.curSpeed = tc.speed;
        // Smooth highway car-following: match lead vehicle speed instead of slamming to 0 km/h
        let targetSpd = tc.speed;
        for (const other of trafficCars) {
          if (other === tc || other.dir !== tc.dir) continue;
          const dtAhead = ((other.t - tc.t) * tc.dir + 1) % 1;
          const distAhead = dtAhead * totalLen;
          if (distAhead > 0 && distAhead < 18.0) {
            const leadSpd = other.curSpeed != null ? other.curSpeed : other.speed;
            targetSpd = Math.min(targetSpd, distAhead < 7.5 ? leadSpd * 0.4 : leadSpd);
          }
        }
        tc.curSpeed += (targetSpd - tc.curSpeed) * Math.min(1, 5.0 * dt);
        tc.t = ((tc.t + (tc.dir * tc.curSpeed * dt) / totalLen) % 1 + 1) % 1;
        const tf = getRoadFrameAtT(tc.t);
        const tp = tf.pos.clone().addScaledVector(tf.right, tc.laneOffset);
        tp.y += 0.08; // Flush with road surface (tires sit at local y=0)
        tc.mesh.position.copy(tp);
        const tFwd = tf.tan.clone().multiplyScalar(tc.dir);
        const tMat = new THREE.Matrix4().lookAt(tp, tp.clone().add(tFwd), tf.up);
        tc.mesh.quaternion.setFromRotationMatrix(tMat);

        // Tro-Tro vs. Traffic track-frame collision & safe overtaking (unless hopping over!)
        if (state.hopY <= 0.65) {
          const dtBus = ((tc.t - state.t) * state.dir + 1) % 1;
          const distAlong = dtBus < 0.5 ? dtBus * totalLen : (dtBus - 1) * totalLen;
          const dLat = Math.abs(tc.laneOffset - state.laneOffset);
          if (state.autoCruise && tc.dir === state.dir && distAlong > -5.5 && distAlong < 15.0 && dLat < 2.2) {
            const oncomingNear = trafficCars.some(o => {
              if (o.dir === state.dir) return false;
              const dOn = ((o.t - state.t) * state.dir + 1) % 1;
              return dOn < 0.5 && dOn * totalLen < 38.0;
            });
            if (!oncomingNear) {
              overtakeUntil = now + 400;
              state.laneOffset += (-state.dir * 2.8 - state.laneOffset) * Math.min(1, 5.5 * dt);
            } else if (distAlong > 0) {
              state.speed += (tc.curSpeed - state.speed) * Math.min(1, 6.0 * dt);
            }
          }
          // Track-aligned bounding-box check (prevents phantom sphere hits across opposite lanes)
          if (Math.abs(distAlong) < 4.7 && dLat < 2.05 && Math.abs(busPos.y - tp.y) < 2.4) {
            if (Math.abs(state.speed) < 0.5) {
              // Stationary bus: let passing traffic nudge clear instead of dragging the parked bus
              tc.t = ((tc.t + (tc.dir * 1.2 * dt) / totalLen) % 1 + 1) % 1;
            } else if (Math.abs(distAlong) >= dLat) {
              if (tc.dir === state.dir) {
                state.speed = Math.min(state.speed, tc.curSpeed * 0.92);
              } else {
                // Oncoming contact: stop safely instead of teleporting state.t backward
                state.speed = 0;
              }
            } else {
              // Side graze: smooth dt-bounded separation, never snap sideways in 1 frame
              const latSign = state.laneOffset >= tc.laneOffset ? 1 : -1;
              const stepLat = Math.min(2.1 - dLat, 4.5 * dt);
              state.laneOffset = Math.max(-(ROAD_HALF - 1.4), Math.min(ROAD_HALF - 1.4, state.laneOffset + latSign * stepLat));
            }
          }
        }
      }

      if (state.camMode === 'chase') {
        camTargetPos.copy(busPos).addScaledVector(fwd, -13.5).addScaledVector(frame.up, 4.8);
        camLookTarget.copy(aheadFrame.pos).addScaledVector(frame.up, 2.0);
      } else if (state.camMode === 'hood') {
        camTargetPos.copy(busPos).addScaledVector(fwd, 2.0).addScaledVector(frame.up, 2.5);
        camLookTarget.copy(aheadFrame.pos).addScaledVector(fwd, 20).addScaledVector(frame.up, 1.6);
      } else {
        camTargetPos.copy(busPos).addScaledVector(fwd, -26).addScaledVector(frame.right, 16).addScaledVector(frame.up, 14);
        camLookTarget.copy(busPos).addScaledVector(fwd, 14);
      }
      const minCamY = Math.max(getTerrainHeight(camTargetPos.x, camTargetPos.z) + 2.4, busPos.y + 2.2);
      if (camTargetPos.y < minCamY) camTargetPos.y = minCamY;
      if (state.snapCam) {
        camera.position.copy(camTargetPos);
        state.snapCam = false;
      } else {
        camera.position.lerp(camTargetPos, Math.min(1, 6.5 * dt));
      }
      camera.lookAt(camLookTarget);

      sunLight.position.set(busPos.x + 120, busPos.y + 190, busPos.z - 100);
      sunLight.target.position.copy(busPos);

      spdEl.textContent = Math.round(Math.abs(state.speed) * 3.6);
      altEl.textContent = Math.round(busPos.y);
      const gradePct = (fwd.y / Math.max(0.01, Math.hypot(fwd.x, fwd.z))) * 100;
      gradeEl.textContent = `${gradePct >= 0 ? '+' : ''}${gradePct.toFixed(1)}%`;
      dirEl.textContent = gradePct > 1.2 ? 'Climbing' : gradePct < -1.2 ? 'Descending' : 'Ridge Level';
      progEl.textContent = `${Math.round(state.t * 100)}%`;

      zonePill.textContent = inKtown
        ? '📍 Koforidua (K-Town) — Eastern Region'
        : inSummit
        ? '📍 Aburi Ridge Summit Lookout'
        : inDownhill
        ? '📍 Downhill Valley Road (Mist & Rain)'
        : '📍 Uphill Mountain Climb';

      syncButtons();
      renderer.render(scene, camera);

      // Exact Ride Danfo Direction Compass Arrow pointing toward Aburi Summit / Valley Stop
      const hudCanvas = document.getElementById('hud-canvas');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const W = window.innerWidth, H = window.innerHeight;
      if (hudCanvas.width !== Math.round(W * dpr) || hudCanvas.height !== Math.round(H * dpr)) {
        hudCanvas.width = Math.round(W * dpr);
        hudCanvas.height = Math.round(H * dpr);
      }
      const hudCtx = hudCanvas.getContext('2d');
      hudCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      hudCtx.clearRect(0, 0, W, H);

      const targetT = inDownhill ? 0.96 : 0.45;
      const stopFrame = getRoadFrameAtT(targetT);
      const distM = Math.round(busPos.distanceTo(stopFrame.pos));
      const angToStop = Math.atan2(stopFrame.pos.x - busPos.x, -(stopFrame.pos.z - busPos.z));
      const camFwd = new THREE.Vector3();
      camera.getWorldDirection(camFwd);
      const camHeading = Math.atan2(camFwd.x, -camFwd.z);
      let relAng = angToStop - camHeading;
      while (relAng > Math.PI) relAng -= Math.PI * 2;
      while (relAng < -Math.PI) relAng += Math.PI * 2;

      const hudEl = document.getElementById('hud');
      const hudBarH = hudEl ? hudEl.getBoundingClientRect().bottom : 86;
      const compassY = Math.max(92, Math.min(200, Math.round(hudBarH + 26)));

      hudCtx.save();
      hudCtx.translate(W * 0.5, compassY);
      hudCtx.rotate(relAng);
      hudCtx.fillStyle = inDownhill ? '#ffb347' : '#46d27a';
      hudCtx.strokeStyle = '#14233b';
      hudCtx.lineWidth = 3;
      hudCtx.beginPath();
      hudCtx.moveTo(0, -16);
      hudCtx.lineTo(13, 12);
      hudCtx.lineTo(0, 6);
      hudCtx.lineTo(-13, 12);
      hudCtx.closePath();
      hudCtx.fill();
      hudCtx.stroke();
      hudCtx.restore();

      hudCtx.save();
      hudCtx.font = '800 11px system-ui, sans-serif';
      hudCtx.textAlign = 'center';
      hudCtx.fillStyle = '#ffffff';
      hudCtx.strokeStyle = '#14233b';
      hudCtx.lineWidth = 3;
      const stopLabel = `${inDownhill ? 'DROP-OFF (VALLEY)' : 'ABURI SUMMIT'} • ${distM}m`;
      hudCtx.strokeText(stopLabel, W * 0.5, compassY + 28);
      hudCtx.fillText(stopLabel, W * 0.5, compassY + 28);
      hudCtx.restore();

      // Draw exact Ride Danfo Chasing Thumbstick Overlay when dragging
      if (stick.down) {
        hudCtx.save();
        hudCtx.strokeStyle = 'rgba(255, 248, 236, 0.85)';
        hudCtx.lineWidth = 2;
        hudCtx.setLineDash([5, 4]);
        hudCtx.beginPath();
        hudCtx.arc(stick.ax, stick.ay, LEASH_PX, 0, Math.PI * 2);
        hudCtx.stroke();
        hudCtx.setLineDash([]);

        hudCtx.fillStyle = 'rgba(20, 35, 59, 0.32)';
        hudCtx.strokeStyle = '#fff8ec';
        hudCtx.lineWidth = 3;
        hudCtx.beginPath();
        hudCtx.arc(stick.ax, stick.ay, 26, 0, Math.PI * 2);
        hudCtx.fill();
        hudCtx.stroke();

        hudCtx.fillStyle = '#fde047';
        hudCtx.strokeStyle = '#14233b';
        hudCtx.lineWidth = 2.5;
        hudCtx.beginPath();
        hudCtx.arc(stick.x, stick.y, 16, 0, Math.PI * 2);
        hudCtx.fill();
        hudCtx.stroke();
        hudCtx.restore();
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
